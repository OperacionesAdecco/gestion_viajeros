function gpsok(p){let {latitude:lat,longitude:lon,accuracy}=p.coords;pos={lat,lon};if(!user){user=L.circleMarker([lat,lon],{radius:9,color:'white',weight:3,fillColor:'#175cd3',fillOpacity:1}).addTo(map);acc=L.circle([lat,lon],{radius:accuracy,color:'#175cd3',fillOpacity:.08}).addTo(map)}else{user.setLatLng([lat,lon]);acc.setLatLng([lat,lon]).setRadius(accuracy)}let last=track.at(-1);if(!last||dm(last[0],last[1],lat,lon)>10){track.push([lat,lon,Date.now()]);localStorage.setItem(TRK,JSON.stringify(track))}if(line)map.removeLayer(line);if(track.length>1)line=L.polyline(track.map(x=>[x[0],x[1]]),{color:'#7f56d9',weight:5}).addTo(map);gps.innerHTML=`<b>GPS activo.</b> Precision: ${Math.round(accuracy)} m`;closest()}
function gpserr(e){gps.innerHTML='<b>No se pudo activar GPS.</b> Revisa el permiso de ubicacion y usa el link HTTPS publicado.'}function gpsgo(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;bgps.textContent='Activar GPS';return}watch=navigator.geolocation.watchPosition(gpsok,gpserr,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});bgps.textContent='Pausar GPS'}
bgps.onclick=gpsgo;reset.onclick=()=>{if(confirm('¿Borrar checks y recorrido de este dispositivo?')){done={};track=[];localStorage.removeItem(KEY);localStorage.removeItem(TRK);location.reload()}};q.oninput=render;filter.onchange=render;markers();if(track.length>1)line=L.polyline(track.map(x=>[x[0],x[1]]),{color:'#7f56d9',weight:5}).addTo(map);render();
</script></body></html>
